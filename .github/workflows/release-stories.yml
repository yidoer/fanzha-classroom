name: Release story pack
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag such as stories-v3
        required: true
      changelog:
        description: Story pack update summary
        required: true
      min_app_version_code:
        description: Minimum compatible Android versionCode
        required: true
        type: number
        default: 7
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-manifest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate and package
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CHANGELOG: ${{ inputs.changelog }}
          MIN_APP_VERSION_CODE: ${{ inputs.min_app_version_code }}
          GITHUB_DOWNLOAD_PROXY: ${{ vars.GITHUB_DOWNLOAD_PROXY }}
        run: |
          [[ "$RELEASE_TAG" =~ ^stories-v([0-9]+)$ ]] || {
            echo "Tag must use the exact stories-vN format"
            exit 1
          }
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Story releases must be dispatched from main"
            exit 1
          }
          PACK_VERSION="${BASH_REMATCH[1]}"
          git fetch origin main
          git show origin/main:story-pack/manifest.json > current-release-manifest.json
          CURRENT_VERSION=$(node -p "require('./current-release-manifest.json').packVersion")
          test "$PACK_VERSION" -gt "$CURRENT_VERSION" || {
            echo "Story pack version must be newer than manifest v$CURRENT_VERSION"
            exit 1
          }
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists"
            exit 1
          fi
          node tools/validate_story_pack.js app/src/main/assets/fraud_cases.json
          node tools/validate_interactive_stories.js app/src/main/assets/interactive_stories.json
          PACK_VERSION="$PACK_VERSION" node tools/build_story_pack.js
          sha256sum --check story-pack.sha256
          PACK_SHA256=$(cut -d ' ' -f 1 story-pack.sha256)
          PACK_VERSION="$PACK_VERSION" PACK_SHA256="$PACK_SHA256" MANIFEST_OUTPUT=story-pack-manifest.json \
            MANIFEST_SOURCE=current-release-manifest.json \
            node tools/update_release_manifest.js stories
          node tools/validate_release_manifest.js story-pack-manifest.json
      - name: Upload packaged stories
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tag }}
          path: |
            story-pack.json
            story-pack.sha256
            story-pack-manifest.json
          if-no-files-found: error
      - name: Publish story pack
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: 剧情包 ${{ inputs.tag }}
          fail_on_unmatched_files: true
          body: |
            ${{ inputs.changelog }}

            应用更新剧情包前会校验 SHA-256，并使用原子替换与失败回退机制保护本地可用版本。
          files: |
            story-pack.json
            story-pack.sha256
            story-pack-manifest.json
      - name: Publish update manifest to main
        run: |
          cp story-pack-manifest.json "$RUNNER_TEMP/story-pack-manifest.json"
          # story-pack.sha256 is generated by this workflow and is not tracked.
          # Restoring it with Git makes this post-release step fail after a successful Release.
          git restore --source=HEAD -- story-pack.json
          rm -f story-pack.sha256
          git fetch origin main
          git checkout -B release-manifest-update origin/main
          cp "$RUNNER_TEMP/story-pack-manifest.json" story-pack-manifest.json
          cp story-pack-manifest.json story-pack/manifest.json
          node tools/validate_release_manifest.js story-pack/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add story-pack/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish story pack ${{ inputs.tag }} manifest"
            if ! git push origin "HEAD:main"; then
              echo "::warning title=剧情包已发布，更新清单未回写::分支保护阻止了 story-pack/manifest.json 回写。请从本次 Actions artifact 或 GitHub Release 下载 story-pack-manifest.json，替换 story-pack/manifest.json 后提交到 main。"
              {
                echo "## 更新清单需要人工回写"
                echo
                echo "剧情包 Release 和 SHA-256 已经发布成功，但分支保护阻止了清单提交。"
                echo "请下载本次产物中的 \`story-pack-manifest.json\`，替换 \`story-pack/manifest.json\`，运行校验后提交："
                echo
                echo '```powershell'
                echo 'Copy-Item story-pack-manifest.json story-pack/manifest.json'
                echo 'node tools/validate_release_manifest.js story-pack/manifest.json'
                echo 'git add story-pack/manifest.json'
                echo 'git commit -m "Publish story pack ${{ inputs.tag }} manifest"'
                echo 'git push origin main'
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

