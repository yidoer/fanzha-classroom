name: Release story pack
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag such as stories-v3
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate and package
        run: |
          node tools/validate_story_pack.js app/src/main/assets/fraud_cases.json
          node tools/validate_interactive_stories.js app/src/main/assets/interactive_stories.json
          node tools/build_story_pack.js
          sha256sum story-pack.json > story-pack.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            story-pack.json
            story-pack.sha256

