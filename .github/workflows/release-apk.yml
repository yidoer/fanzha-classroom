name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version such as 0.7.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --console=plain
      - name: Prepare release assets
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/fanzha-classroom-${{ inputs.version }}-debug.apk
          sha256sum releases/fanzha-classroom-${{ inputs.version }}-debug.apk | awk '{print $1}' > releases/fanzha-classroom-${{ inputs.version }}-debug.apk.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ inputs.version }}
          name: FanZha Classroom v${{ inputs.version }}
          body: |
            Automated debug APK build for v${{ inputs.version }}.
          files: |
            releases/fanzha-classroom-${{ inputs.version }}-debug.apk
            releases/fanzha-classroom-${{ inputs.version }}-debug.apk.sha256